aid: rayon
name: Rayon
description: >-
  Rayon is an AI-powered CAD (computer-aided design) platform built for interior
  designers and architects, positioned as a modern, browser-based alternative to
  legacy tools like AutoCAD and SketchUp. It provides professional 2D drafting and
  BIM-like tools (walls, zones, openings), real-time collaborative editing,
  annotation and dimensioning, layers and styles, parametric and library blocks,
  schedule/table generation, and DWG/DXF/PDF/image import and export. AI features
  cover asset generation, visualization, and image tracing, and teams can publish
  shared libraries and templates and present projects to clients. Rayon is a
  venture-backed company (Northzone, Seedcamp) delivered as a hosted web
  application; as of this enrichment pass it publishes no public developer API,
  SDK, webhook, or plugin surface — the product is end-user software with
  documentation, an academy, and a community forum.
